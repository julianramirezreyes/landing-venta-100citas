<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@420;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 600px; height: 600px; background: #f4efe6; }
    #cover {
      width: 600px;
      height: 600px;
      overflow: hidden;
      background: #f4efe6;
      display: flex;
      flex-direction: column;
      font-family: "Outfit", "Avenir Next", sans-serif;
      color: #241c16;
    }
    .head {
      height: 248px;
      padding: 28px 36px 18px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9d4328;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 560;
      font-size: 68px;
      line-height: 0.9;
      letter-spacing: -0.035em;
    }
    .sub {
      margin-top: 14px;
      color: #655b52;
      font-size: 18px;
      letter-spacing: 0.01em;
    }
    .art {
      height: 352px;
      overflow: hidden;
    }
    .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 78%;
    }
  </style>
</head>
<body>
  <div id="cover">
    <div class="head">
      <p class="brand">
        <svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="12" cy="16" r="8" fill="none" stroke="#9d4328" stroke-width="2"/>
          <circle cx="20" cy="16" r="8" fill="none" stroke="#241c16" stroke-width="2"/>
        </svg>
        Verdad entre dos
      </p>
      <h1>100 citas,<br>una historia</h1>
      <p class="sub">Cien experiencias para dos</p>
    </div>
    <div class="art">
      <img src="arte.jpg" alt="">
    </div>
  </div>
</body>
</html>
